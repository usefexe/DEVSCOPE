<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVScope|search</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="./js/shortlist.js" defer type="module"></script>
</head>
<body  class="bg-[url('./imgs/backround2.png')] bg-no-repeat bg-cover bg-center w-full min-h-screen  bg-fixed
             min-h-screen pb-20" >
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <header class=" max-w-[900px] ml-40 h-18 mt-[30px] px-6   " >
  <nav class="flex  justify-between bg-[#080D1B] font-sans rounded-[20px] border-[#22D3EE] px-6 items-center">
     
    <div>
        <img src="./imgs/logog.png" alt="logo-devScop" class="w-40" >
    
    </div>

    <!-- Navigation -->
    <ul class=" flex gap-9 text-sm">
      <li><a href="./index.html" class="text-slate-200 hover:text-cyan-400 transition-colors font-semibold">Accueil</a></li>
      <li><a  class="text-slate-200 hover:text-cyan-400 transition-colors font-semibold">Recherche</a></li>
      <li><a href="./search.html" class="bg-cyan-500/20 text-cyan-400 px-5 py-2 rounded-xl font-semibold" >Shortlist</a></li>
    </ul>

    <!-- Actions -->
    <div>
     
      <button class="bg-gradient-to-r from-cyan-400 to-pink-500
       text-white font-semibold px-5 py-1 rounded-xl">Se connecter</button>
    </div>
  </nav>
</header>

<main class="max-w-[1400px] mx-auto px-5 md:px-8 py-12">

  <!-- ================= HEADER ================= -->
  <div class="mb-10">
    <h1 class="text-4xl md:text-5xl font-extrabold text-white">
      Ma
      <span class="text-[#22D3EE]">shortlist</span>
    </h1>

    <p class="mt-3 text-[#94A3B8] text-base">
      <span id="candidateCount">2</span>
      candidat(s) dans votre shortlist
    </p>
  </div>

  <!-- ================= FILTERS + SEARCH ================= -->
  <div class="flex flex-col lg:flex-row lg:items-center
              lg:justify-between gap-6 mb-8">

    <!-- Filtres -->
    <div id="statusFilters"
         class="flex items-center gap-1 p-1
                bg-[#111827] border border-[#293047]
                rounded-2xl sm:rounded-full
                overflow-x-auto max-w-full">

      <button type="button" data-filter="all"
              class="px-5 py-3 rounded-full text-sm
                     font-semibold text-white
                     bg-gradient-to-r from-cyan-400
                     to-pink-500 whitespace-nowrap">
        Tous
      </button>

      <button type="button" data-filter="a_contacter"
              class="px-5 py-3 rounded-full text-sm
                     font-medium text-[#94A3B8]
                     hover:text-cyan-400 transition
                     whitespace-nowrap">
        À contacter
      </button>

      <button type="button" data-filter="entretien"
              class="px-5 py-3 rounded-full text-sm
                     font-medium text-[#94A3B8]
                     hover:text-cyan-400 transition">
        Entretien
      </button>

      <button type="button" data-filter="retenu"
              class="px-5 py-3 rounded-full text-sm
                     font-medium text-[#94A3B8]
                     hover:text-cyan-400 transition">
        Retenu
      </button>

      <button type="button" data-filter="refuse"
              class="px-5 py-3 rounded-full text-sm
                     font-medium text-[#94A3B8]
                     hover:text-cyan-400 transition">
        Refusé
      </button>
    </div>

    <!-- Recherche -->
    <div class="flex items-center gap-3
                w-full lg:w-[350px] h-13
                bg-[#151C30]/80
                border border-[#334155]
                rounded-2xl px-5
                focus-within:border-cyan-400
                transition">

      <i class="fa-solid fa-magnifying-glass
                text-xl text-[#22D3EE]"></i>

      <input id="candidateSearch"
             type="search"
             placeholder="Rechercher un candidat..."
             aria-label="Rechercher un candidat"
             class="w-full bg-transparent border-none
                    outline-none text-[#F1F5F9]
                    placeholder:text-[#94A3B8]
                    text-sm"/>
    </div>
  </div>

  <!-- ================= CANDIDATES ================= -->
  <section id="shortlistContainer"
           class="flex flex-col gap-5">

    <!-- =============== CARD 1 =============== -->
    <article class="flex flex-col lg:flex-row
                    lg:items-center lg:justify-between
                    gap-6 p-6 md:p-7
                    bg-[#101626]/90
                    border border-[#293047]
                    rounded-3xl
                    hover:border-purple-500/60
                    hover:shadow-[0_0_25px_rgba(168,85,247,0.10)]
                    transition-all duration-300">

      <!-- Informations -->
      <div class="flex items-center gap-5 min-w-0">

        <!-- Avatar -->
        <div class="shrink-0 p-[3px] rounded-full
                    bg-gradient-to-br from-pink-500
                    via-purple-500 to-cyan-400
                    shadow-[0_0_20px_rgba(168,85,247,0.25)]">

          <img src="https://github.com/octocat.png"
               alt="Avatar de soufiane boushaba"
               class="w-17 h-17 md:w-20 md:h-20
                      rounded-full object-cover
                      bg-[#101626]"/>
        </div>

        <!-- Détails -->
        <div class="min-w-0">
          <h3 class="text-xl font-bold text-[#F1F5F9]">
            soufiane boushaba
          </h3>

          <div class="flex flex-wrap items-center gap-3 mt-1">
            <span class="text-sm text-[#94A3B8]">
              @SOUFIANE-BOUSHABA
            </span>

            <span class="px-3 py-1 rounded-lg
                         text-xs font-semibold
                         text-cyan-400 bg-cyan-500/10
                         border border-cyan-500/40">
              Java
            </span>
          </div>

          <p class="text-cyan-200 italic text-sm mt-2">
            test
          </p>

          <p class="flex items-center gap-2 mt-2
                    text-sm text-[#94A3B8]">
            <i class="fa-regular fa-calendar-days"></i>
            Ajouté le 06/11/2026
          </p>
        </div>
      </div>

      <!-- Rating + Actions -->
      <div class="flex flex-wrap items-center gap-3
                  lg:justify-end shrink-0">

        <!-- Rating -->
        <div class="flex items-center gap-1 mr-2
                    text-[#A3E635] text-lg"
             aria-label="5 étoiles sur 5">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
        </div>

        <!-- Statut -->
        <span class="flex items-center gap-2
                     px-3 py-2 rounded-xl
                     text-xs font-bold uppercase
                     text-rose-400 bg-rose-500/10
                     border border-rose-500/50">

          <i class="fa-solid fa-circle text-[8px]"></i>
          Refusé
        </span>

        <!-- Modifier -->
        <button type="button"
                class="flex items-center gap-2
                       px-4 py-2 rounded-xl
                       text-sm font-semibold
                       text-cyan-400 bg-cyan-500/10
                       border border-cyan-500/50
                       hover:bg-cyan-500/20 transition">
          <i class="fa-solid fa-pen"></i>
          Modifier
        </button>

        <!-- Supprimer -->
        <button type="button"
                class="flex items-center gap-2
                       px-4 py-2 rounded-xl
                       text-sm font-semibold
                       text-rose-400 bg-rose-500/10
                       border border-rose-500/30
                       hover:bg-rose-500/20 transition">
          <i class="fa-solid fa-xmark"></i>
          Supprimer
        </button>

      </div>
    </article>

    <!-- =============== CARD 2 =============== -->
    <article class="flex flex-col lg:flex-row
                    lg:items-center lg:justify-between
                    gap-6 p-6 md:p-7
                    bg-[#101626]/90
                    border border-[#293047]
                    rounded-3xl
                    hover:border-purple-500/60
                    hover:shadow-[0_0_25px_rgba(168,85,247,0.10)]
                    transition-all duration-300">

      <!-- Informations -->
      <div class="flex items-center gap-5 min-w-0">

        <div class="shrink-0 p-[3px] rounded-full
                    bg-gradient-to-br from-pink-500
                    via-purple-500 to-cyan-400
                    shadow-[0_0_20px_rgba(168,85,247,0.25)]">

          <img src="https://github.com/identicons/octocat.png"
               alt="Avatar du candidat test"
               class="w-17 h-17 md:w-20 md:h-20
                      rounded-full object-cover
                      bg-[#101626]"/>
        </div>

        <div class="min-w-0">
          <h3 class="text-xl font-bold text-[#F1F5F9]">
            test
          </h3>

          <div class="flex flex-wrap items-center gap-3 mt-1">
            <span class="text-sm text-[#94A3B8]">
              @test
            </span>

            <span class="px-3 py-1 rounded-lg
                         text-xs font-semibold
                         text-cyan-400 bg-cyan-500/10
                         border border-cyan-500/40">
              Matlab
            </span>
          </div>

          <p class="text-cyan-200 italic text-sm mt-2">
            Aucune note.
          </p>

          <p class="flex items-center gap-2 mt-2
                    text-sm text-[#94A3B8]">
            <i class="fa-regular fa-calendar-days"></i>
            Ajouté le 09/11/2026
          </p>
        </div>
      </div>

      <!-- Rating + Actions -->
      <div class="flex flex-wrap items-center gap-3
                  lg:justify-end shrink-0">

        <div class="flex items-center gap-1 mr-2
                    text-[#A3E635] text-lg"
             aria-label="3 étoiles sur 5">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>

        <span class="flex items-center gap-2
                     px-3 py-2 rounded-xl
                     text-xs font-bold uppercase
                     text-cyan-400 bg-cyan-500/10
                     border border-cyan-500/50">

          <i class="fa-solid fa-circle text-[8px]"></i>
          À contacter
        </span>

        <button type="button"
                class="flex items-center gap-2
                       px-4 py-2 rounded-xl
                       text-sm font-semibold
                       text-cyan-400 bg-cyan-500/10
                       border border-cyan-500/50
                       hover:bg-cyan-500/20 transition">
          <i class="fa-solid fa-pen"></i>
          Modifier
        </button>

        <button type="button"
                class="flex items-center gap-2
                       px-4 py-2 rounded-xl
                       text-sm font-semibold
                       text-rose-400 bg-rose-500/10
                       border border-rose-500/30
                       hover:bg-rose-500/20 transition">
          <i class="fa-solid fa-xmark"></i>
          Supprimer
        </button>

      </div>
    </article>

  </section>
</main>


</body>
</html>
